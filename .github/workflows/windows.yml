# Pacchetto di Clockwise per Windows.
# Su un vero Windows: costruisce Clockwise.exe e l'installatore e li prova davvero (avvio, pagine,
# uscita, installazione e disinstallazione silenziose). I due file restano allegati all'esecuzione.
# È l'unico posto in cui l'eseguibile gira su Windows prima di arrivare agli utenti.
# La pubblicazione nella release della versione (v<versione>, file con la versione nel nome) NON è automatica:
# si chiede a mano da Actions → Windows → Run workflow, spuntando "pubblica".
name: Windows

on:
  workflow_dispatch:
    inputs:
      pubblica:
        description: 'Pubblica installatore e manuale nella release della versione (v<versione>)'
        type: boolean
        default: false
  push:
    branches:
      - ccr-7bd5e0b0-69ciny
    paths:
      - 'server/**'
      - 'app/**'
      - 'installer/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

# Un push nuovo ferma la build precedente dello stesso ramo.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pacchetto:
    name: Clockwise.exe e installatore
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # Senza questo git su Windows trasforma i fine riga in CRLF: i file dentro l'eseguibile
      # devono essere identici a quelli del repository.
      - name: Fine riga come nel repository
        run: git config --global core.autocrlf false

      - name: Sorgenti
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Test
        run: npm test

      # Di solito NSIS è già sulla macchina; se manca lo installa Chocolatey.
      - name: NSIS (makensis)
        run: |
          $standard = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if ((Get-Command makensis -ErrorAction SilentlyContinue) -or (Test-Path $standard)) {
            Write-Host 'NSIS già installato'
          } else {
            # il registro di Chocolatey a volte risponde 504: si riprova, e si controlla che makensis ci sia davvero
            for ($i = 1; $i -le 4 -and -not (Test-Path $standard); $i++) {
              choco install nsis -y --no-progress
              if (-not (Test-Path $standard)) { Write-Host "NSIS non installato (tentativo $i), riprovo tra $(15 * $i) secondi"; Start-Sleep -Seconds (15 * $i) }
            }
            if (-not (Test-Path $standard)) { throw 'Installazione di NSIS non riuscita dopo 4 tentativi' }
          }

      # Firma digitale: attiva solo se nei segreti del repository c'è il certificato
      # (Settings → Secrets and variables → Actions): WINDOWS_CERT_PFX_BASE64 e WINDOWS_CERT_PASSWORD.
      - name: Build (Clockwise.exe + installatore)
        env:
          CLOCKWISE_FIRMA_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CLOCKWISE_FIRMA_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run build:windows

      # ---- Prova 1: l'eseguibile parte, serve l'interfaccia incorporata e si chiude su richiesta
      - name: Prova di Clockwise.exe
        env:
          CLOCKWISE_NO_BROWSER: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLOCKWISE_DATA = Join-Path $env:RUNNER_TEMP 'clockwise-dati'
          $exe = (Resolve-Path 'dist/windows/Clockwise.exe').Path
          $log = Join-Path $env:RUNNER_TEMP 'clockwise-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'clockwise-err.txt'
          $base = 'http://127.0.0.1:5757'

          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
          $null = $p.Handle # senza questo PowerShell non conserva il codice di uscita
          try {
            # attesa dell'avvio: al massimo 30 secondi
            $stato = $null
            $limite = (Get-Date).AddSeconds(30)
            while (-not $stato -and -not $p.HasExited -and (Get-Date) -lt $limite) {
              try { $stato = Invoke-RestMethod "$base/api/stato" -TimeoutSec 5 } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $stato) { throw 'Clockwise.exe non risponde su 127.0.0.1:5757 entro 30 secondi' }
            Write-Host "stato: $($stato | ConvertTo-Json -Compress -Depth 5)"
            if ($stato.eseguibile -ne $true) { throw '/api/stato: "eseguibile" non è true' }
            $versione = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($stato.versione -ne $versione) { throw "/api/stato: versione $($stato.versione), attesa $versione" }

            $pagina = Invoke-WebRequest "$base/" -UseBasicParsing
            if ($pagina.StatusCode -ne 200 -or $pagina.Content -notmatch 'Clockwise') { throw 'La pagina iniziale non contiene "Clockwise"' }

            # un file di vendor/, un modulo JS e il CSS: 200 e stessa lunghezza del file nel repository
            foreach ($percorso in 'vendor/xlsx.full.min.js', 'js/main.js', 'css/app.css') {
              $r = Invoke-WebRequest "$base/$percorso" -UseBasicParsing
              $attesa = (Get-Item "app/$percorso").Length
              if ($r.StatusCode -ne 200 -or $r.RawContentLength -ne $attesa) { throw "GET /$percorso -> $($r.StatusCode), $($r.RawContentLength) byte (attesi $attesa)" }
              Write-Host "GET /$percorso -> 200, $attesa byte"
            }

            # uscita pulita
            $esci = Invoke-RestMethod "$base/api/esci" -Method Post
            if ($esci.ok -ne $true) { throw 'POST /api/esci non ha risposto ok' }
            if (-not $p.WaitForExit(15000)) { throw 'Clockwise.exe è ancora aperto 15 secondi dopo POST /api/esci' }
            if ($p.ExitCode -ne 0) { throw "Clockwise.exe è uscito con codice $($p.ExitCode)" }
            Write-Host 'Clockwise.exe: avvio, interfaccia e uscita a posto'
          } finally {
            if (-not $p.HasExited) { $p.Kill() }
            Write-Host '--- finestra di Clockwise ---'
            Get-Content $log, $err -ErrorAction SilentlyContinue
          }

      # ---- Prova 1b: collegamento a Claude. Si installa Claude Code con l'installatore ufficiale e si avvia
      # Clockwise con un PATH che NON contiene la cartella di Claude Code (come succede a un programma aperto dal
      # menu Start subito dopo l'installazione): Clockwise deve trovarlo lo stesso. Senza account l'accesso resta da fare.
      - name: Prova del collegamento a Claude Code
        env:
          CLOCKWISE_NO_BROWSER: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          try { irm https://claude.ai/install.ps1 | iex } catch { Write-Host "::warning::Installatore di Claude Code non riuscito: $_"; exit 0 }
          $claude = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          if (-not (Test-Path $claude)) { Write-Host "::warning::Claude Code non trovato in $claude dopo l'installazione"; Get-ChildItem (Join-Path $env:USERPROFILE '.local') -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 FullName; exit 0 }
          Write-Host "Claude Code installato: $(& $claude --version)"
          # PATH senza la cartella di Claude Code, e senza leggerla dal registro: resta solo la ricerca nelle cartelle note
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and ($_ -notmatch '\\\.local\\bin') }) -join ';'
          $env:CLOCKWISE_DATA = Join-Path $env:RUNNER_TEMP 'clockwise-dati-claude'
          $env:PORT = '5777'
          $p = Start-Process -FilePath (Resolve-Path 'dist/windows/Clockwise.exe').Path -PassThru -NoNewWindow
          try {
            $stato = $null; $limite = (Get-Date).AddSeconds(60)
            while (-not $stato -and -not $p.HasExited -and (Get-Date) -lt $limite) { try { $stato = Invoke-RestMethod 'http://127.0.0.1:5777/api/stato' -TimeoutSec 30 } catch { Start-Sleep -Milliseconds 500 } }
            if (-not $stato) { throw 'Clockwise.exe non risponde' }
            Write-Host "claudeCode: $($stato.claudeCode | ConvertTo-Json -Compress)"
            if ($stato.claudeCode.installato -ne $true) { throw 'Clockwise non trova Claude Code installato fuori dal PATH' }
            if ($stato.claudeCode.percorso -notmatch '\.local\\bin\\claude\.exe$') { throw "Percorso inatteso: $($stato.claudeCode.percorso)" }
            $d = Invoke-RestMethod 'http://127.0.0.1:5777/api/diagnosi' -TimeoutSec 60
            Write-Host '--- diagnosi ---'; Write-Host $d.testo
            if ($d.claudeCode.trovato -ne $true) { throw 'La diagnosi non trova Claude Code' }
            Invoke-RestMethod 'http://127.0.0.1:5777/api/esci' -Method Post | Out-Null
            if (-not $p.WaitForExit(15000)) { throw 'Clockwise.exe non si chiude' }
            Write-Host 'Collegamento a Claude Code: trovato fuori dal PATH, diagnosi a posto'
          } finally { if (-not $p.HasExited) { $p.Kill() } }

      # ---- Prova 2: installazione e disinstallazione silenziose, senza diritti di amministratore
      - name: Prova dell'installatore
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'dist/windows/Clockwise-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installatore non trovato in dist/windows' }
          $cartella = Join-Path $env:LOCALAPPDATA 'Programs\Clockwise'
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Clockwise.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Clockwise.lnk'
          $chiave = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Clockwise'

          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "L'installatore è uscito con codice $($i.ExitCode)" }
          foreach ($f in "$cartella\Clockwise.exe", "$cartella\Disinstalla.exe", $menu) {
            if (-not (Test-Path $f)) { throw "Dopo l'installazione manca: $f" }
          }
          if (-not (Test-Path $desktop)) { Write-Host "::warning::Collegamento sul desktop non trovato: $desktop" }
          if (-not (Test-Path "$cartella\Manuale di Clockwise.pdf")) { throw "Dopo l'installazione manca il manuale" }
          if ((Get-FileHash "$cartella\Clockwise.exe").Hash -ne (Get-FileHash 'dist/windows/Clockwise.exe').Hash) { throw 'Il file installato non è quello appena costruito' }
          $voce = Get-ItemProperty $chiave
          if ($voce.DisplayName -ne 'Clockwise' -or -not $voce.UninstallString) { throw 'Voce di "App installate" incompleta' }
          Write-Host "Installato: $($voce.DisplayName) $($voce.DisplayVersion) in $($voce.InstallLocation)"

          # Il disinstallatore si copia in %TEMP% e lavora da lì: si aspetta che la cartella sparisca.
          $u = Start-Process -FilePath "$cartella\Disinstalla.exe" -ArgumentList '/S' -Wait -PassThru
          for ($n = 0; $n -lt 60 -and (Test-Path $cartella); $n++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $cartella) { throw "Dopo la disinstallazione la cartella esiste ancora: $cartella" }
          if (Test-Path $menu) { throw 'Dopo la disinstallazione resta il collegamento nel menu Start' }
          if (Test-Path $chiave) { throw 'Dopo la disinstallazione resta la voce in "App installate"' }
          Write-Host 'Installatore: installazione e disinstallazione silenziose a posto'

      # ---- Prova 3: firma digitale.
      # Con il certificato vero: Clockwise.exe e installatore devono risultare firmati e validi.
      # Senza: si firma una copia con un certificato di prova usa e getta, per dimostrare che la firma
      # non rompe l'eseguibile (i file allegati restano quelli non firmati).
      - name: Prova della firma
        env:
          CLOCKWISE_NO_BROWSER: '1'
          HA_CERTIFICATO: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HA_CERTIFICATO -eq 'true') {
            foreach ($f in (Get-Item 'dist/windows/Clockwise.exe'), (Get-ChildItem 'dist/windows/Clockwise-Setup-*.exe' | Select-Object -First 1)) {
              $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
              Write-Host "$($f.Name): $($s.Status) — $($s.SignerCertificate.Subject)"
              if ($s.Status -ne 'Valid') { throw "$($f.Name): firma non valida ($($s.Status))" }
              if (-not $s.TimeStamperCertificate) { throw "$($f.Name): manca la marca temporale" }
            }
            Write-Host 'Firma digitale: valida su eseguibile e installatore'
            exit 0
          }
          $cartella = Join-Path $env:RUNNER_TEMP 'firma-prova'
          New-Item -ItemType Directory -Force $cartella | Out-Null
          $cert = New-SelfSignedCertificate -Subject 'CN=Clockwise prova CI' -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My
          $pwd = ConvertTo-SecureString -String 'prova-ci' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$cartella\prova.pfx" -Password $pwd | Out-Null
          Copy-Item 'dist/windows/Clockwise.exe' "$cartella\Clockwise.exe"
          $env:CLOCKWISE_FIRMA_PFX = "$cartella\prova.pfx"; $env:CLOCKWISE_FIRMA_PASSWORD = 'prova-ci'
          node scripts/windows/firma.mjs "$cartella\Clockwise.exe"
          if ($LASTEXITCODE -ne 0) { throw 'firma.mjs non è riuscito a firmare la copia' }
          $s = Get-AuthenticodeSignature -LiteralPath "$cartella\Clockwise.exe"
          if (-not $s.SignerCertificate) { throw 'La copia firmata non risulta firmata' }
          Write-Host "Copia firmata: $($s.Status) — $($s.SignerCertificate.Subject) (certificato di prova, non riconosciuto: atteso)"
          $env:CLOCKWISE_DATA = Join-Path $env:RUNNER_TEMP 'clockwise-dati-firma'
          $env:PORT = '5767'
          $p = Start-Process -FilePath "$cartella\Clockwise.exe" -PassThru -NoNewWindow
          try {
            $stato = $null; $limite = (Get-Date).AddSeconds(30)
            while (-not $stato -and -not $p.HasExited -and (Get-Date) -lt $limite) { try { $stato = Invoke-RestMethod 'http://127.0.0.1:5767/api/stato' -TimeoutSec 5 } catch { Start-Sleep -Milliseconds 500 } }
            if (-not $stato) { throw "L'eseguibile firmato non risponde" }
            Invoke-RestMethod 'http://127.0.0.1:5767/api/esci' -Method Post | Out-Null
            if (-not $p.WaitForExit(15000)) { throw "L'eseguibile firmato non si chiude" }
            Write-Host "Eseguibile firmato: avvio e uscita a posto (versione $($stato.versione))"
          } finally { if (-not $p.HasExited) { $p.Kill() } }
          Remove-Item -LiteralPath $cert.PSPath

      # ---- I due file restano allegati a questa esecuzione
      - name: File allegati all'esecuzione
        uses: actions/upload-artifact@v4
        with:
          name: clockwise-windows
          path: |
            dist/windows/Clockwise.exe
            dist/windows/Clockwise-Setup-*.exe
            docs/Manuale-Clockwise.pdf
          if-no-files-found: error

  # ---- Prova su macchine Windows diverse, come farebbe un utente: si installa con l'installatore, si avvia il
  #   programma installato, si preme «Installa Claude Code» (stessa strada del pulsante), si fa la richiesta reale di
  #   prova e la diagnosi. Senza un account la richiesta deve fallire con il codice «login» (è la verifica che
  #   Clockwise riconosce bene la situazione); con il segreto CLAUDE_CODE_OAUTH_TOKEN (creato con «claude setup-token»)
  #   la richiesta deve riuscire davvero.
  macchine:
    name: Collegamento reale su ${{ matrix.os }}${{ matrix.profilo && ' (cartella utente con spazi e accenti)' || '' }}
    needs: pacchetto
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # la variante con la cartella utente «difficile» avvisa senza bloccare la pubblicazione
    continue-on-error: ${{ matrix.profilo != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        profilo: ['']
        include:
          # come su un PC il cui utente si chiama «Mario Rossi» o «Niccolò»: spazi e lettere accentate nei percorsi
          - os: windows-2025
            profilo: 'Niccolò De Rossi'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: File costruiti
        uses: actions/download-artifact@v4
        with:
          name: clockwise-windows
          path: scaricati

      - name: Installazione, Claude Code e richiesta reale
        env:
          CLOCKWISE_NO_BROWSER: '1'
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HA_ACCOUNT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          PROFILO_DI_PROVA: ${{ matrix.profilo }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Macchina: $((Get-CimInstance Win32_OperatingSystem).Caption) build $([Environment]::OSVersion.Version.Build), $env:PROCESSOR_ARCHITECTURE"
          $setup = Get-ChildItem -Recurse 'scaricati' -Filter 'Clockwise-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installatore non trovato tra i file della build' }
          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "L'installatore è uscito con codice $($i.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Clockwise\Clockwise.exe'
          if (-not (Test-Path $exe)) { throw "Dopo l'installazione manca $exe" }
          $base = 'http://127.0.0.1:5757'
          $corpo = @{ 'Content-Type' = 'application/json' }
          if ($env:PROFILO_DI_PROVA) {
            # cartella utente con spazi e lettere accentate: Claude Code e Clockwise devono cavarsela lo stesso
            $profilo = Join-Path $env:RUNNER_TEMP $env:PROFILO_DI_PROVA
            foreach ($d in $profilo, "$profilo\AppData\Roaming", "$profilo\AppData\Local") { New-Item -ItemType Directory -Force $d | Out-Null }
            $env:USERPROFILE = $profilo; $env:APPDATA = "$profilo\AppData\Roaming"; $env:LOCALAPPDATA = "$profilo\AppData\Local"
            $env:HOMEDRIVE = $profilo.Substring(0, 2); $env:HOMEPATH = $profilo.Substring(2)
            Write-Host "Cartella utente di prova: $profilo"
          }
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow
          try {
            $stato = $null; $limite = (Get-Date).AddSeconds(60)
            while (-not $stato -and -not $p.HasExited -and (Get-Date) -lt $limite) { try { $stato = Invoke-RestMethod "$base/api/stato" -TimeoutSec 30 } catch { Start-Sleep -Milliseconds 500 } }
            if (-not $stato) { throw 'Il programma installato non risponde' }
            Write-Host "Avviato Clockwise $($stato.versione); Claude Code prima: $($stato.claudeCode | ConvertTo-Json -Compress)"

            # 1) il pulsante «Installa Claude Code»
            if ($stato.claudeCode.installato -ne $true) {
              $r = Invoke-RestMethod "$base/api/claude/installa" -Method Post -TimeoutSec 900
              Write-Host "--- uscita dell'installatore di Claude Code ---"; Write-Host $r.uscita
              if ($r.ok -ne $true) { throw 'Il pulsante «Installa Claude Code» non è riuscito' }
              $stato = $r.stato
            }
            if ($stato.claudeCode.installato -ne $true -or -not $stato.claudeCode.versione) { throw 'Dopo la sua installazione Clockwise non vede Claude Code' }
            Write-Host "Claude Code: $($stato.claudeCode.versione) in $($stato.claudeCode.percorso) [$($stato.claudeCode.origine)], accesso: $($stato.claudeCode.loggato)"

            # 2) la richiesta reale di prova
            $prova = Invoke-RestMethod "$base/api/prova" -Method Post -Headers $corpo -Body '{"provider":"claude-code","modello":"claude-fable-5-2"}' -TimeoutSec 300
            Write-Host "Prova reale: $($prova | ConvertTo-Json -Compress -Depth 5)"
            if ($env:HA_ACCOUNT -eq 'true') {
              if ($prova.ok -ne $true) { throw "Con l'account configurato la richiesta reale a Claude non è riuscita: [$($prova.codice)] $($prova.messaggio)" }
              Write-Host "RICHIESTA REALE RIUSCITA: $($prova.modello) ha risposto «$($prova.risposta)» in $($prova.ms) ms"
            } else {
              if ($prova.ok -eq $true) { throw 'La prova è riuscita senza account: inatteso' }
              if ($prova.codice -ne 'login') { throw "Senza account Clockwise doveva riconoscere l'accesso mancante (codice «login»), invece: [$($prova.codice)] $($prova.messaggio)" }
              Write-Host 'Senza account: accesso mancante riconosciuto correttamente (per la richiesta reale serve il segreto CLAUDE_CODE_OAUTH_TOKEN)'
            }

            # 3) la diagnosi
            $d = Invoke-RestMethod "$base/api/diagnosi" -TimeoutSec 300
            Write-Host '--- diagnosi ---'; Write-Host $d.testo
            if ($d.claudeCode.trovato -ne $true) { throw 'La diagnosi non trova Claude Code' }
            if (($d.rete | Where-Object { $_.url -match 'api.anthropic.com' }).ok -ne $true) { throw 'La diagnosi dice che api.anthropic.com non è raggiungibile' }

            # 4) il pulsante «Accedi» deve avviare l'accesso (qui nessuno lo completa: si chiude il processo)
            $a = Invoke-RestMethod "$base/api/claude/accedi" -Method Post -TimeoutSec 60
            if ($a.ok -ne $true) { throw 'Il pulsante Accedi non ha avviato il login' }
            Start-Sleep -Seconds 5
            $login = Get-CimInstance Win32_Process -Filter "Name = 'claude.exe'" | Where-Object { $_.CommandLine -match 'auth\s+login' }
            if ($login) { Write-Host "Accesso avviato (processo $($login.ProcessId)): lo chiudo"; $login | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }
            elseif ($env:HA_ACCOUNT -ne 'true') { Write-Host '::warning::Dopo «Accedi» non risulta il processo di accesso di Claude Code' }

            Invoke-RestMethod "$base/api/esci" -Method Post | Out-Null
            if (-not $p.WaitForExit(15000)) { throw 'Il programma non si chiude' }
            Write-Host 'Programma installato: installazione di Claude Code, prova reale, diagnosi e accesso a posto'
          } finally { if (-not $p.HasExited) { $p.Kill() } }

      # Dati su disco, programma in background, avvio all'accensione, chiusura dal menu Start: sul programma installato.
      - name: Archivio su disco, background e chiusura
        env:
          CLOCKWISE_NO_BROWSER: '1'
          PROFILO_DI_PROVA: ${{ matrix.profilo }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Clockwise\Clockwise.exe'
          $base = 'http://127.0.0.1:5757'
          $json = @{ 'Content-Type' = 'application/json' }
          $menu = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $menu 'Chiudi Clockwise.lnk'))) { throw 'Nel menu Start manca «Chiudi Clockwise»' }
          # niente finestra nera: nell'intestazione del file il sottosistema deve essere 2 (finestre), non 3 (console)
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C); $sotto = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sotto -ne 2) { throw "Clockwise.exe ha sottosistema $($sotto): aprirebbe la finestra della console" }
          if ($env:PROFILO_DI_PROVA) {
            $profilo = Join-Path $env:RUNNER_TEMP $env:PROFILO_DI_PROVA
            $env:USERPROFILE = $profilo; $env:APPDATA = "$profilo\AppData\Roaming"
          }
          $dati = Join-Path $env:APPDATA 'Clockwise'
          function Attendi { $s = $null; $limite = (Get-Date).AddSeconds(60); while (-not $s -and (Get-Date) -lt $limite) { try { $s = Invoke-RestMethod "$base/api/stato" -TimeoutSec 10 } catch { Start-Sleep -Milliseconds 500 } }; if (-not $s) { throw 'Clockwise non risponde' }; $s }
          function Spento { $limite = (Get-Date).AddSeconds(20); while ((Get-Date) -lt $limite) { try { Invoke-RestMethod "$base/api/stato" -TimeoutSec 2 | Out-Null; Start-Sleep -Milliseconds 500 } catch { return $true } }; return $false }

          # avvio come dal menu Start: nessuna console, nessuna redirezione
          Start-Process -FilePath $exe
          $stato = Attendi
          if ($stato.sfondo -ne $true -or $stato.archivio -ne $true) { throw "Stato inatteso: $($stato | ConvertTo-Json -Compress)" }
          $finestre = @(Get-Process -Name Clockwise | Where-Object { $_.MainWindowHandle -ne 0 })
          if ($finestre.Count) { throw 'Clockwise ha aperto una finestra' }

          # un dossier e un file originale: devono finire nella cartella dei dati dell'utente
          $dossier = '{"id":"provaci1","nome":"Città — «è» già lì","documenti":[],"dati":{}}'
          Invoke-RestMethod "$base/api/archivio/kv/progetto%3Aprovaci1" -Method Put -Headers $json -Body ([Text.Encoding]::UTF8.GetBytes($dossier)) | Out-Null
          $file = Join-Path $dati 'archivio\kv\progetto~provaci1.json'
          if (-not (Test-Path -LiteralPath $file)) { throw "Il dossier non è su disco: $file" }
          $pdf = Join-Path $env:RUNNER_TEMP 'originale.pdf'; [IO.File]::WriteAllBytes($pdf, [Text.Encoding]::ASCII.GetBytes('%PDF-1.4 prova'))
          $nome = [Uri]::EscapeDataString('Contratto è firmato: v2.pdf')
          $r = Invoke-RestMethod "$base/api/archivio/file/provaci1/doc1?nome=$nome" -Method Put -InFile $pdf
          $originale = Join-Path $dati "archivio\originali\provaci1\doc1\$($r.nome)"
          if (-not (Test-Path -LiteralPath $originale)) { throw "Il file originale non è su disco: $originale" }
          Write-Host "Su disco: $file e $originale"

          # avvio all'accensione: voce nel registro dell'utente, poi tolta
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $prg = Invoke-RestMethod "$base/api/programma/avvio-automatico" -Method Post -Headers $json -Body '{"attivo":true}'
          $voce = (Get-ItemProperty $run -Name Clockwise -ErrorAction SilentlyContinue).Clockwise
          if ($prg.avvioAutomatico.attivo -ne $true -or $voce -notmatch '--sfondo' -or $voce -notmatch 'Clockwise\.exe') { throw "Avvio all'accensione non impostato: «$voce»" }
          Write-Host "Avvio all'accensione: $voce"
          Invoke-RestMethod "$base/api/programma/avvio-automatico" -Method Post -Headers $json -Body '{"attivo":false}' | Out-Null
          if ((Get-ItemProperty $run -Name Clockwise -ErrorAction SilentlyContinue).Clockwise) { throw "La voce di avvio all'accensione è rimasta nel registro" }

          # «Chiudi Clockwise» del menu Start: Clockwise.exe --esci ferma quello attivo in background
          Start-Process -FilePath $exe -ArgumentList '--esci' -Wait
          if (-not (Spento)) { throw 'Dopo --esci Clockwise è ancora attivo' }

          # riavvio in background (--sfondo, come all'accensione): i dati di prima ci sono ancora
          Start-Process -FilePath $exe -ArgumentList '--sfondo'
          Attendi | Out-Null
          $letto = Invoke-RestMethod "$base/api/archivio/kv/progetto%3Aprovaci1"
          if ($letto.nome -ne 'Città — «è» già lì') { throw "Dopo il riavvio il dossier non è quello salvato: $($letto.nome)" }
          $elenco = Invoke-RestMethod "$base/api/archivio"
          if ($elenco.originali -lt 1) { throw 'Dopo il riavvio manca il file originale' }
          Invoke-RestMethod "$base/api/esci" -Method Post | Out-Null
          if (-not (Spento)) { throw 'Il programma non si chiude' }
          # apertura del browser: senza finestra nera è l'unico segnale di avvio. Qui il programma parte come dal
          # menu Start (senza CLOCKWISE_NO_BROWSER) e si guarda se il browser predefinito apre l'indirizzo di Clockwise.
          # i browser rimasti aperti dai passi precedenti vanno chiusi: un browser già aperto riceve l'indirizzo
          # senza far nascere un processo riconoscibile, e la verifica risulterebbe a vuoto
          Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2
          $prima = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'localhost:5757' -and $_.Name -notmatch 'Clockwise|pwsh|powershell' }).Count
          $env:CLOCKWISE_NO_BROWSER = $null; Remove-Item Env:CLOCKWISE_NO_BROWSER -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe
          Attendi | Out-Null
          $aperto = $null; $limite = (Get-Date).AddSeconds(30)
          while (-not $aperto -and (Get-Date) -lt $limite) { Start-Sleep -Seconds 1; $aperto = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'localhost:5757' -and $_.Name -notmatch 'Clockwise|pwsh|powershell' } | Select-Object -First 1 }
          $console = @(Get-Process -Name Clockwise | Where-Object { $_.MainWindowHandle -ne 0 }).Count
          Invoke-RestMethod "$base/api/esci" -Method Post | Out-Null
          if (-not (Spento)) { throw 'Il programma non si chiude' }
          if ($aperto) { Write-Host "BROWSER APERTO: $($aperto.Name) -> $($aperto.CommandLine)" }
          else {
            # controprova: il sistema, da solo, riesce ad aprire un browser su questa macchina?
            Start-Process 'http://localhost:5757/'; Start-Sleep -Seconds 15
            $daSolo = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'localhost:5757' -and $_.Name -notmatch 'Clockwise|pwsh|powershell' } | Select-Object -First 1
            if ($daSolo) { throw "All'avvio Clockwise non ha aperto il browser, mentre il sistema ci riesce ($($daSolo.Name)): processi prima $prima" }
            Write-Host '::warning::Su questa macchina nessun browser si apre nemmeno dal sistema: apertura del browser non verificabile qui'
          }
          if ($console) { throw 'Clockwise ha aperto una finestra propria' }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'localhost:5757' -and $_.Name -notmatch 'Clockwise|pwsh|powershell' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $env:CLOCKWISE_NO_BROWSER = '1'

          $registro = Join-Path $dati 'clockwise.log'
          Write-Host '--- clockwise.log ---'; Get-Content -LiteralPath $registro
          if (-not (Select-String -LiteralPath $registro -Pattern 'è in esecuzione' -Quiet)) { throw 'Nel registro manca la riga di avvio' }
          if (-not (Select-String -LiteralPath $registro -Pattern '--esci' -Quiet)) { throw 'Nel registro manca la chiusura con --esci' }
          Write-Host 'Dati su disco, background, avvio automatico e chiusura: a posto'

  # ---- Solo su richiesta: i file provati sopra vengono pubblicati nella release della versione, v<versione>,
  #   con il numero di versione in ogni nome di file (es. Clockwise-Setup-2.0.1.exe) e segnata come «Latest»:
  #   https://github.com/<proprietario>/<repository>/releases/latest porta sempre all'ultima.
  rilascio:
    name: Release della versione
    needs: [pacchetto, macchine]
    if: github.event_name == 'workflow_dispatch' && inputs.pubblica
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # per creare la release e caricarvi i file
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Sorgenti
        uses: actions/checkout@v4

      - name: File costruiti e provati
        uses: actions/download-artifact@v4
        with:
          name: clockwise-windows
          path: scaricati

      - name: Release v<versione>
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versione = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$versione"
          # l'archivio dell'esecuzione mantiene le cartelle: exe in dist/windows, manuale in docs
          $cartella = Join-Path $env:RUNNER_TEMP 'pubblica'
          New-Item -ItemType Directory -Force $cartella | Out-Null
          $setup = Get-ChildItem -Recurse 'scaricati' -Filter "Clockwise-Setup-$versione.exe" | Select-Object -First 1
          $exe = Get-ChildItem -Recurse 'scaricati' -Filter 'Clockwise.exe' | Select-Object -First 1
          $manuale = Get-ChildItem -Recurse 'scaricati' -Filter 'Manuale-Clockwise.pdf' | Select-Object -First 1
          if (-not $setup -or -not $exe -or -not $manuale) { throw "File mancanti tra quelli della build (installatore $versione, Clockwise.exe, manuale)" }
          # nomi con la versione: si capisce sempre che cosa si sta scaricando
          $nomi = @{ setup = "Clockwise-Setup-$versione.exe"; exe = "Clockwise-$versione.exe"; manuale = "Manuale-Clockwise-$versione.pdf" }
          Copy-Item $setup.FullName (Join-Path $cartella $nomi.setup)
          Copy-Item $exe.FullName (Join-Path $cartella $nomi.exe)
          Copy-Item $manuale.FullName (Join-Path $cartella $nomi.manuale)
          $scarica = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $note = Join-Path $env:RUNNER_TEMP 'note.md'
          @(
            "Clockwise $versione per Windows 10 e 11 (64 bit), costruito dal commit $env:GITHUB_SHA.",
            '',
            "- **[$($nomi.setup)]($scarica/$($nomi.setup))**: l'installatore, quello da scaricare. Si installa sopra la versione precedente; i dossier restano. Non servono i diritti di amministratore.",
            "- **[$($nomi.exe)]($scarica/$($nomi.exe))**: il solo programma, senza installazione.",
            "- **[$($nomi.manuale)]($scarica/$($nomi.manuale))**: istruzioni complete di funzionamento (sono incluse anche nell'installazione).",
            '',
            'Per controllare la versione installata: in Clockwise il numero è accanto al nome, in alto a sinistra.',
            '',
            'I file non hanno una firma digitale: al primo avvio Windows mostra «PC protetto da Windows».',
            'Premi **Ulteriori informazioni** e poi **Esegui comunque**. I dettagli sono in `installer/LEGGIMI.md`.'
          ) | Set-Content -Path $note -Encoding utf8

          # una versione già pubblicata si ripubblica da capo (stesso numero = stessi nomi)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Non riesco a sostituire la release $tag" }
          }
          gh release create $tag (Join-Path $cartella $nomi.setup) (Join-Path $cartella $nomi.exe) (Join-Path $cartella $nomi.manuale) `
            --target $env:GITHUB_SHA --title "Clockwise $versione per Windows" --notes-file $note --latest
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione della release non riuscita' }
          Write-Host "Pubblicato: $scarica/$($nomi.setup)"
